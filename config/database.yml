# PostgreSQL. Development and test use the server in compose.yaml (`docker compose up -d`),
# whose user and password are the defaults below; DB_HOST, DB_PORT, DB_USERNAME and
# DB_PASSWORD point elsewhere.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "instaposts") %>
  # No GSSAPI (Kerberos) encryption, which no server here offers: on macOS, libpq trying it
  # in a forked process (the parallel test workers) crashes Ruby.
  gssencmode: disable

development:
  <<: *default
  database: instaposts_development
  password: <%= ENV.fetch("DB_PASSWORD", "instaposts-dev-secret") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: instaposts_test
  password: <%= ENV.fetch("DB_PASSWORD", "instaposts-dev-secret") %>

# One server, four databases: the app's, and Solid Cache's, Solid Queue's and Solid Cable's.
# bin/docker-entrypoint creates or migrates them all on boot (db:prepare).
production:
  primary: &primary_production
    <<: *default
    database: instaposts_production
    password: <%= ENV["DB_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: instaposts_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: instaposts_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: instaposts_production_cable
    migrations_paths: db/cable_migrate
