"""
Requires that exactly one field must be supplied and that field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

type Comment implements Node {
  author: User!
  body: String!
  createdAt: DateTime!
  id: ID!
  post: Post!
  updatedAt: DateTime!

  """
  Whether the signed-in user may delete it: CommentPolicy#destroy?.
  """
  viewerCanDelete: Boolean!

  """
  Whether the signed-in user may edit it: CommentPolicy#update?.
  """
  viewerCanUpdate: Boolean!
}

"""
A paginated list of Comment edges.
"""
type CommentConnection {
  """
  A list of Comment edges.
  """
  edges: [CommentEdge!]!

  """
  Pagination information about the list of edges.
  """
  pageInfo: PageInfo!
}

"""
An edge that contains a node of type Comment and a cursor.
"""
type CommentEdge {
  """
  A unique cursor that can be used for pagination.
  """
  cursor: String!

  """
  The Comment node.
  """
  node: Comment!
}

input CreateCommentInput {
  body: String!
  postId: ID!
}

input CreatePostInput {
  content: String!

  """
  Images and videos, in order (at most 10). @upload stores each on the media bucket and
  hands Post#files= its signed id.
  """
  files: [Upload!]
  name: String!
}

scalar DateTime

scalar JSON

type Mutation {
  """
  Comment on a post as the signed-in user.
  """
  createComment(input: CreateCommentInput!): Comment
  createPost(input: CreatePostInput!): Post

  """
  Delete a comment: its author, the post's author or an admin.
  """
  deleteComment(id: ID!): Comment

  """
  Move a post to the trash (discard): its author or an admin. Mutations::DeletePost.
  """
  deletePost(id: ID!): Post

  """
  Delete a trashed post for good, with its likes and comments. Admins only.
  """
  forceDeletePost(id: ID!): Post

  """
  Like a post as the signed-in user. Liking it again changes nothing. Mutations::LikePost.
  """
  likePost(id: ID!): Post

  """
  Remove the signed-in user's picture: back to the provider's, or the initials. Mutations::RemoveAvatar.
  """
  removeAvatar: User!

  """
  Bring a post back from the trash. Admins only.
  """
  restorePost(id: ID!): Post
  sendWebhookEvent(input: SendWebhookEventInput!): SendWebhookEventResponse!

  """
  Take back the signed-in user's like. Mutations::UnlikePost.
  """
  unlikePost(id: ID!): Post

  """
  Edit one of the signed-in user's comments.
  """
  updateComment(input: UpdateCommentInput!): Comment
  updatePost(input: UpdatePostInput!): Post

  """
  Change the signed-in user's name or picture.
  """
  updateProfile(input: UpdateProfileInput!): User!

  """
  Change a user's role. Admins only, and never their own.
  """
  updateUserRole(id: ID!, role: UserRole!): User
}

"""
An object with an ID.
"""
interface Node {
  """
  ID of the object.
  """
  id: ID!
}

"""
Information about pagination using a Relay style cursor connection.
"""
type PageInfo {
  """
  Number of nodes in the current page.
  """
  count: Int!

  """
  Index of the current page.
  """
  currentPage: Int!

  """
  The cursor to continue paginating forwards.
  """
  endCursor: String

  """
  When paginating forwards, are there more items?
  """
  hasNextPage: Boolean!

  """
  When paginating backwards, are there more items?
  """
  hasPreviousPage: Boolean!

  """
  Index of the last available page.
  """
  lastPage: Int!

  """
  The cursor to continue paginating backwards.
  """
  startCursor: String

  """
  Total number of nodes in the paginated connection.
  """
  total: Int!
}

type Post implements Node {
  """
  Its images and videos, in order; empty for a post with text only.
  """
  assets: [PostAsset!]!
  author: User

  """
  Oldest first, unless orderBy says otherwise.
  """
  comments(
    """
    A cursor after which elements are returned.
    """
    after: String

    """
    Limits number of fetched items.
    """
    first: Int! = 10

    """
    Order by clause for Post.comments.orderBy.
    """
    orderBy: [PostCommentsOrderByOrderByClause!]
  ): CommentConnection!
  commentsCount: Int!
  content: String!
  createdAt: DateTime!

  """
  When it went to the trash; null for a live post.
  """
  deletedAt: DateTime
  id: ID!

  """
  How many users like the post.
  """
  likesCount: Int!
  name: String!

  """
  The post's page in the app (/posts/:id): Types::PostType#path.
  """
  path: String!
  updatedAt: DateTime!

  """
  Whether the signed-in user may move it to the trash: PostPolicy#destroy?.
  """
  viewerCanDelete: Boolean!

  """
  Whether the signed-in user likes the post; false for guests. Types::PostType#viewer_has_liked.
  """
  viewerHasLiked: Boolean!
}

"""
An image or video of a post: an Active Storage attachment on the public media bucket.
"""
type PostAsset {
  contentType: String!
  id: ID!
  kind: PostAssetKind!

  """
  Its URL on the public media bucket: plain and permanent.
  """
  url: String!
}

"""
How a post's file is shown.
"""
enum PostAssetKind {
  IMAGE
  VIDEO
}

"""
Allowed column names for Post.comments.orderBy.
"""
enum PostCommentsOrderByColumn {
  CREATED_AT
}

"""
Order by clause for Post.comments.orderBy.
"""
input PostCommentsOrderByOrderByClause {
  """
  The column that is used for ordering.
  """
  column: PostCommentsOrderByColumn!

  """
  The direction that is used for ordering.
  """
  order: SortOrder!
}

"""
A paginated list of Post edges.
"""
type PostConnection {
  """
  A list of Post edges.
  """
  edges: [PostEdge!]!

  """
  Pagination information about the list of edges.
  """
  pageInfo: PageInfo!
}

"""
An edge that contains a node of type Post and a cursor.
"""
type PostEdge {
  """
  A unique cursor that can be used for pagination.
  """
  cursor: String!

  """
  The Post node.
  """
  node: Post!
}

"""
Indicates what fields are available at the top level of a query operation.
"""
type Query {
  """
  The signed-in user, identified by the bearer JWT.
  """
  me: User

  """
  Fetches an object given its ID. Resolved by Types::QueryType#node, with InstaPostsSchema.object_from_id.
  """
  node(
    """
    ID of the object.
    """
    id: ID!
  ): Node

  """
  Fetches a list of objects given a list of IDs. Resolved by Types::QueryType#nodes.
  """
  nodes(
    """
    IDs of the objects.
    """
    ids: [ID!]!
  ): [Node]

  """
  A post by its global id. Authorized by PostPolicy#show?.
  """
  post(id: ID!): Post

  """
  Live posts. The trashed argument lists the trash too: admins only (PostPolicy#view_trashed?).
  """
  posts(
    """
    A cursor after which elements are returned.
    """
    after: String

    """
    Limits number of fetched items.
    """
    first: Int!

    """
    Order by clause for Query.posts.orderBy.
    """
    orderBy: [QueryPostsOrderByOrderByClause!]

    """
    Specify if you want to include or exclude trashed results from a query.
    """
    trashed: Trashed
  ): PostConnection!

  """
  A user, by id or by @username: as public as their page. Authorized by UserPolicy#show?.
  """
  user(by: UserBy!): User

  """
  Every user. Admins only.
  """
  users(
    """
    A cursor after which elements are returned.
    """
    after: String

    """
    Limits number of fetched items.
    """
    first: Int!
  ): UserConnection!
}

"""
Allowed column names for Query.posts.orderBy.
"""
enum QueryPostsOrderByColumn {
  CREATED_AT
  NAME
}

"""
Order by clause for Query.posts.orderBy.
"""
input QueryPostsOrderByOrderByClause {
  """
  The column that is used for ordering.
  """
  column: QueryPostsOrderByColumn!

  """
  The direction that is used for ordering.
  """
  order: SortOrder!
}

input SendWebhookEventInput {
  clientMutationId: String
  eventName: String!
  payload: JSON!
}

type SendWebhookEventResponse {
  message: String
  success: Boolean!
}

"""
Directions for ordering a list of records.
"""
enum SortOrder {
  """
  Sort records in ascending order.
  """
  ASC

  """
  Sort records in descending order.
  """
  DESC
}

"""
Specify if you want to include or exclude trashed results from a query.
"""
enum Trashed {
  """
  Only return trashed results.
  """
  ONLY

  """
  Return both trashed and non-trashed results.
  """
  WITH

  """
  Only return non-trashed results.
  """
  WITHOUT
}

input UpdateCommentInput {
  body: String!
  id: ID!
}

input UpdatePostInput {
  content: String
  id: ID!
  name: String
}

input UpdateProfileInput {
  """
  A new picture, cropped in the browser. @upload stores it on the media bucket.
  """
  avatar: Upload
  name: String

  """
  A new handle: lowercase letters, numbers, underscores and periods. Their page moves with it.
  """
  username: String
}

"""
A file sent with a multipart request (the GraphQL multipart request spec).
"""
scalar Upload

type User implements Node {
  """
  The picture the user chose, else the provider's: Types::UserType#avatar_url.
  """
  avatarUrl: String
  createdAt: DateTime!

  """
  Only visible to the user themselves and to admins; null for everyone else.
  """
  email: String
  id: ID!
  name: String!

  """
  Their live posts, trashed ones left out. Newest first with orderBy created_at.
  """
  posts(
    """
    A cursor after which elements are returned.
    """
    after: String

    """
    Limits number of fetched items.
    """
    first: Int!

    """
    Order by clause for User.posts.orderBy.
    """
    orderBy: [UserPostsOrderByOrderByClause!]
  ): PostConnection!
  postsCount: Int!
  role: UserRole!
  updatedAt: DateTime!

  """
  Their handle, unique and lowercase: their public page is /@username.
  """
  username: String!
}

"""
How to find one user: by exactly one of these (@oneOf). A query that gives none, both
or null is rejected before anything resolves.
"""
input UserBy @oneOf {
  """
  Their global id, as User.id gives it.
  """
  id: ID

  """
  Their @username, lowercase: what their page's address carries.
  """
  username: String
}

"""
A paginated list of User edges.
"""
type UserConnection {
  """
  A list of User edges.
  """
  edges: [UserEdge!]!

  """
  Pagination information about the list of edges.
  """
  pageInfo: PageInfo!
}

"""
An edge that contains a node of type User and a cursor.
"""
type UserEdge {
  """
  A unique cursor that can be used for pagination.
  """
  cursor: String!

  """
  The User node.
  """
  node: User!
}

"""
Allowed column names for User.posts.orderBy.
"""
enum UserPostsOrderByColumn {
  CREATED_AT
}

"""
Order by clause for User.posts.orderBy.
"""
input UserPostsOrderByOrderByClause {
  """
  The column that is used for ordering.
  """
  column: UserPostsOrderByColumn!

  """
  The direction that is used for ordering.
  """
  order: SortOrder!
}

enum UserRole {
  ADMIN
  AUTHOR
  READER
}
