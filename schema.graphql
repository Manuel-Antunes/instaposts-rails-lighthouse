"""
Return an aggregate of a column over the records of a model, or of a relation of the parent.
The records are narrowed by the field's argument filters (@eq, @where, ...).
An unknown function, or a failing aggregation, answers null.
"""
directive @aggregate(
  """
  The column to aggregate. COUNT does not use it.
  """
  column: String

  """
  The aggregate to compute: SUM, AVG, MIN, MAX or COUNT (case-insensitive).
  """
  function: String!

  """
  The class name of the model whose records to aggregate. Takes precedence over `relation`.
  """
  model: String

  """
  The relation of the parent to aggregate over.
  """
  relation: String
) on FIELD_DEFINITION

"""
Get a collection of models as the field result: all the model's records,
narrowed by `scopes`, @builder and the field's argument filters (@eq, @where, ...).
"""
directive @all(
  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Defer the execution of mutations to queued jobs.
The field answers true once the job is queued.
"""
directive @async(
  """
  The name of the queue to dispatch the job on.
  """
  queue: String
) on FIELD_DEFINITION

"""
Require an authenticated user (`context[:current_user]`) before the field resolves,
else fail with "Unauthenticated.". @guard is the configurable equivalent.
"""
directive @auth on FIELD_DEFINITION

"""
Resolve the inverse of a one-to-one or one-to-many association (`belongs_to`),
batch-loaded so that loading it for many parents is not an N+1.
"""
directive @belongsTo(
  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Resolve a many-to-many association of the parent (`has_and_belongs_to_many`) as a list,
batch-loaded so that listing it for many parents is not an N+1.
With `type`, the list is paginated.
"""
directive @belongsToMany(
  """
  The page size when the client omits `first`. Defaults to Config.pagination_default_count.
  """
  defaultCount: Int

  """
  The most records the client may ask for with `first`; null for no limit. Defaults to Config.pagination_max_count.
  """
  maxCount: Int

  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]

  """
  How to paginate the list: PAGINATOR, SIMPLE or CONNECTION. Without it, the whole list is returned.
  """
  type: PaginateType
) on FIELD_DEFINITION

"""
Replace argument values with the corresponding model (or some other value)
before passing them to the resolver.
"""
directive @bind(
  """
  A model class, or a class whose `call(value, context)` returns what the value stands for.
  """
  class: String!

  """
  The column the value is matched against, for a model.
  """
  column: String = "id"

  """
  Pass null instead of failing when no record matches.
  """
  optional: Boolean = false

  """
  Relations to eager-load on the bound records.
  """
  with: [String!] = []
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
Broadcast the result of the field to the subscribers of a subscription, once it resolved successfully.
A null result, or an error, broadcasts nothing.
"""
directive @broadcast(
  """
  Broadcast in a background job instead of in the request. Defaults to Config.queue_broadcasts.
  """
  shouldQueue: Boolean

  """
  The name of the subscription field to trigger.
  """
  subscription: String!
) repeatable on FIELD_DEFINITION

"""
Manipulate the query builder with a method.
"""
directive @builder(
  """
  The builder class, in the builders namespace.
  """
  class: String

  """
  The method to call: a name (default `call`), or a class and a method separated by `@`.
  """
  method: String

  """
  On a field, the value the method gets after the relation, instead of the arguments.
  """
  value: BuilderValue
) repeatable on ARGUMENT_DEFINITION | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Cache the field's resolved value in Rails.cache.
The key covers the parent object, the field and its arguments.
"""
directive @cache(
  """
  How long, in seconds, the value is kept. Without it, until @clearCache or eviction.
  """
  maxAge: Int

  """
  Keep a value per authenticated user, instead of one shared by all (guests share one).
  """
  private: Boolean = false
) on FIELD_DEFINITION

"""
Set the HTTP Cache-Control header of the response, from the fields and types a query selects.
The response may be cached for the lowest maxAge among them, and is private if any scope is.
"""
directive @cacheControl(
  """
  Use the maxAge of the parent field. The `maxAge` argument is ignored.
  """
  inheritMaxAge: Boolean = false

  """
  The maximum amount of time, in seconds, the field's value may be cached. 0 means `no-cache`.
  """
  maxAge: Int = 0

  """
  Who a cached response may be shared with.
  """
  scope: CacheControlScope = PUBLIC
) on FIELD_DEFINITION | INTERFACE | OBJECT | UNION

"""
Mark the field whose value identifies its object in the keys of @cache and @clearCache.
Without one, the first field of type ID is used.
"""
directive @cacheKey on FIELD_DEFINITION

"""
Check a policy against the models whose primary keys an argument holds, before the field resolves.
"""
directive @canFind(
  """
  The ability to check, which the policy answers with a predicate: "update" calls `PostPolicy#update?`.
  """
  ability: String!

  """
  What to do when the check fails.
  """
  action: CanAction = EXCEPTION_PASS

  """
  Constant values to pass to the policy method, after the injected arguments.
  """
  args: CanArgs

  """
  The path of the argument holding the id, or a list of ids, of the models to check: "id", or "input.ids".
  """
  find: String!

  """
  Fail when an id matches no model. With false, only the models found are checked.
  """
  findOrFail: Boolean = true

  """
  Pass the field's arguments to the policy method, as its first extra argument.
  """
  injectArgs: Boolean = false

  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  The value to return, when `action` is RETURN_VALUE.
  """
  returnValue: CanArgs

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) repeatable on FIELD_DEFINITION

"""
Check a policy against the model class itself, before the field resolves,
e.g. `create?` before a @create.
"""
directive @canModel(
  """
  The ability to check, which the policy answers with a predicate: "update" calls `PostPolicy#update?`.
  """
  ability: String!

  """
  What to do when the check fails.
  """
  action: CanAction = EXCEPTION_PASS

  """
  Constant values to pass to the policy method, after the injected arguments.
  """
  args: CanArgs

  """
  Pass the field's arguments to the policy method, as its first extra argument.
  """
  injectArgs: Boolean = false

  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  The value to return, when `action` is RETURN_VALUE.
  """
  returnValue: CanArgs
) repeatable on FIELD_DEFINITION

"""
Check a policy against each model the field's query would return,
narrowed by the field's argument filters (@eq, @where, ...), before the field resolves.
"""
directive @canQuery(
  """
  The ability to check, which the policy answers with a predicate: "update" calls `PostPolicy#update?`.
  """
  ability: String!

  """
  What to do when the check fails.
  """
  action: CanAction = EXCEPTION_PASS

  """
  Constant values to pass to the policy method, after the injected arguments.
  """
  args: CanArgs

  """
  Pass the field's arguments to the policy method, as its first extra argument.
  """
  injectArgs: Boolean = false

  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  The value to return, when `action` is RETURN_VALUE.
  """
  returnValue: CanArgs

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) repeatable on FIELD_DEFINITION

"""
Check a policy against whatever the field resolved to, each item of a list, after it resolves.
The field runs first: only use it on fields that do not change data.
"""
directive @canResolved(
  """
  The ability to check, which the policy answers with a predicate: "update" calls `PostPolicy#update?`.
  """
  ability: String!

  """
  What to do when the check fails.
  """
  action: CanAction = EXCEPTION_PASS

  """
  Constant values to pass to the policy method, after the injected arguments.
  """
  args: CanArgs

  """
  Pass the field's arguments to the policy method, as its first extra argument.
  """
  injectArgs: Boolean = false

  """
  The value to return, when `action` is RETURN_VALUE.
  """
  returnValue: CanArgs
) repeatable on FIELD_DEFINITION

"""
Check a policy against the parent object of the field, before the field resolves.
"""
directive @canRoot(
  """
  The ability to check, which the policy answers with a predicate: "update" calls `PostPolicy#update?`.
  """
  ability: String!

  """
  What to do when the check fails.
  """
  action: CanAction = EXCEPTION_PASS

  """
  Constant values to pass to the policy method, after the injected arguments.
  """
  args: CanArgs

  """
  Pass the field's arguments to the policy method, as its first extra argument.
  """
  injectArgs: Boolean = false

  """
  The value to return, when `action` is RETURN_VALUE.
  """
  returnValue: CanArgs
) repeatable on FIELD_DEFINITION

"""
On a mutation, invalidate @cache entries once the field resolved successfully.
"""
directive @clearCache(
  """
  Narrow the entries to those of this field.
  """
  field: String

  """
  Narrow the entries to those of the objects with the ids found at this path.
  """
  idSource: ClearCacheIdSource

  """
  The name of the type whose entries to clear. Alone, it clears all of that type's entries.
  """
  type: String!
) repeatable on FIELD_DEFINITION

"""
Customize the cost of a field in the complexity score of a query, which graphql-ruby checks
against the schema's `max_complexity`. Without a resolver, the field costs 1 plus its selection,
once per item asked for on a paginated field.
"""
directive @complexity(
  """
  The analyzer class that gives the cost, looked up in
  Config.namespaces[:analyzers]. It includes
  Lighthouse::GraphQL::ComplexityAnalyzer and declares `complexity`.
  """
  resolver: String
) on FIELD_DEFINITION

"""
Replaces incoming empty strings `""` with `null`.

When used upon fields, empty strings for non-nullable inputs will pass unchanged.
Only explicitly placing this on non-nullable inputs will force the conversion.
"""
directive @convertEmptyStringsToNull on ARGUMENT_DEFINITION | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Return the number of records: of a model's table, or of a relation of the parent.
The count honors `scopes`, @builder and the field's argument filters (@eq, @where, ...).
"""
directive @count(
  """
  The class name of the model whose records to count. Takes precedence over `relation`.
  """
  model: String

  """
  The relation of the parent to count. Defaults to the field's name, when the parent has it.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Create a model from the field's arguments, through ActiveRecord, so the model's validations apply.
Nested input on its associations runs as nested mutations.
On an argument or input field, it creates the record on that association of the parent.
"""
directive @create(
  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  On an argument or input field: the association of the parent model that its
  mutation acts on. Defaults to the argument's name in snake_case.
  """
  relation: String
) on ARGUMENT_DEFINITION | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Create many models, one per input of the field's single list argument.
If any is invalid nothing is saved, and the errors of all are reported.
"""
directive @createMany(
  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  On an argument or input field: the association of the parent model that its
  mutation acts on. Defaults to the argument's name in snake_case.
  """
  relation: String
) on ARGUMENT_DEFINITION | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Delete the models the field's argument filters (@whereKey, @eq, ...) select, running their callbacks,
and return them: a list for a list field, else the first or null. Refuses to run without a filter argument.
"""
directive @delete(
  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  On an argument or input field: the association of the parent model that its
  mutation acts on. Defaults to the argument's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on ARGUMENT_DEFINITION | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Ignore the user given value, don't pass it to the resolver.
"""
directive @drop on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
Assign an internal value to an enum key.
When dealing with the Enum type in your code,
you will receive the defined value instead of the string key.
"""
directive @enum(
  """
  The internal value of the enum key.
  """
  value: Mixed
) on ENUM_VALUE

"""
Add an equality filter to the query: the column equals the value.
"""
directive @eq(
  """
  The column to filter on. Defaults to the argument's name in snake_case.
  """
  key: String
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
Dispatch an event once the field has resolved. The event is built with the resolved value,
which is returned unchanged. Nothing is dispatched if the field fails.
"""
directive @event(
  """
  The event class, looked up in Config.namespaces[:events]. A fully-qualified name is used as-is.
  """
  dispatch: String!
) repeatable on FIELD_DEFINITION

"""
Include a field or an object type in the schema only while a feature flag is in a given state,
for the actor of the request (Flipper by default, see Config.feature_checker).
Otherwise, it is hidden from introspection and a query selecting it is invalid.
"""
directive @feature(
  """
  The name of the feature flag.
  """
  name: String!

  """
  The state the feature must be in for the element to be visible.
  """
  when: FeatureState = ACTIVE
) on FIELD_DEFINITION | OBJECT

"""
Assign a resolver to a field: a class, or a class and a method separated by `@`
("Statistics@users_total"). Without a method, the class resolves, or is called.
"""
directive @field(
  """
  Alias of `resolver`, used when `resolver` is not given.
  """
  class: String

  """
  The resolver: a class, or a class and a method separated by `@`. Required unless `class` is given.
  """
  resolver: String
) on FIELD_DEFINITION

"""
Find a single record by the field's argument filters (@eq, @where, ...), or null.
More than one match is an error. A lookup by `id` alone is batched.
"""
directive @find(
  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Get the first record that matches the field's argument filters (@eq, @where, ...),
or null. Unlike @find, it does not fail when more than one record matches.
"""
directive @first(
  """
  The class name of the model to use. Defaults to the model of another directive on the field, else the field's return type.
  """
  model: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Permanently remove one or more soft deleted models.
"""
directive @forceDelete(
  """
  Specify the class name of the model to use. This is only needed when the default model detection does not work.
  """
  model: String

  """
  Apply scopes to the underlying query.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Converts between IDs/types and global IDs.

When used upon a field, it encodes;
when used upon an argument, it decodes.
"""
directive @globalId(
  """
  Decoding a global id produces a tuple of `$type` and `$id`.
  This setting controls which of those is passed along.
  """
  decode: GlobalIdDecode = ARRAY
) on ARGUMENT_DEFINITION | FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""
Require an authenticated user (see Config.authenticated_user) before the field resolves,
else fail with "Unauthenticated.".
"""
directive @guard on FIELD_DEFINITION

"""
Resolve a one-to-many association of the parent (`has_many`) as a list,
batch-loaded so that listing it for many parents is not an N+1.
With `type`, the list is paginated.
"""
directive @hasMany(
  """
  The page size when the client omits `first`. Defaults to Config.pagination_default_count.
  """
  defaultCount: Int

  """
  The most records the client may ask for with `first`; null for no limit. Defaults to Config.pagination_max_count.
  """
  maxCount: Int

  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]

  """
  How to paginate the list: PAGINATOR, SIMPLE or CONNECTION. Without it, the whole list is returned.
  """
  type: PaginateType
) on FIELD_DEFINITION

"""
Resolve a one-to-many association of the parent that goes through another (`has_many :through`)
as a list, batch-loaded so that listing it for many parents is not an N+1.
With `type`, the list is paginated.
"""
directive @hasManyThrough(
  """
  The page size when the client omits `first`. Defaults to Config.pagination_default_count.
  """
  defaultCount: Int

  """
  The most records the client may ask for with `first`; null for no limit. Defaults to Config.pagination_max_count.
  """
  maxCount: Int

  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]

  """
  How to paginate the list: PAGINATOR, SIMPLE or CONNECTION. Without it, the whole list is returned.
  """
  type: PaginateType
) on FIELD_DEFINITION

"""
Resolve a one-to-one association of the parent (`has_one`),
batch-loaded so that loading it for many parents is not an N+1.
"""
directive @hasOne(
  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Resolve a one-to-one association of the parent that goes through another (`has_one :through`),
batch-loaded so that loading it for many parents is not an N+1.
"""
directive @hasOneThrough(
  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Hash an argument value with BCrypt (has_secure_password's), e.g. a password.
"""
directive @hash on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
Excludes the annotated element from the schema conditionally.
"""
directive @hide(
  """
  Specify which environments must not use this field, e.g. ["production"].
  """
  env: [String!]!
) on FIELD_DEFINITION

"""
Filter by a list of values: the column is one of them.
"""
directive @in(
  """
  The column to filter on. Defaults to the argument's name in snake_case.
  """
  key: String
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
Set an argument from the request's context, on the server, so clients cannot set it.
"""
directive @inject(
  """
  A path in the context, with dots: "current_user.id".
  """
  context: String!

  """
  The name of the argument to set, with dots for a nested one: "input.author_id".
  """
  name: String!
) repeatable on FIELD_DEFINITION

"""
The class that picks the object type of this interface's values: `resolve_type(object, context)`
or `call(object, context)`, returning a type name or a type class.
"""
directive @interface(
  """
  The class to call, looked up in Config.namespaces[:types]. A fully-qualified name is used as-is.
  """
  resolveType: String!
) on INTERFACE

"""
Eager-load relations of the records the field returns.
"""
directive @lazyLoad(
  """
  The relations to load, nested with dots.
  """
  relations: [String!]!
) repeatable on FIELD_DEFINITION

"""
Filter with SQL LIKE: the column contains the value, which is wrapped in wildcards.
"""
directive @like(
  """
  The column to filter on. Defaults to the argument's name in snake_case.
  """
  key: String
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""
Allow clients to specify the maximum number of results to return when used on an argument,
or statically limit them when used on a field.

By default, this directive does not influence the number of results the resolver queries internally,
but limits how much of it is returned to clients. Use the `builder` argument to change this.
"""
directive @limit(
  """
  You may set this to `true` if the field uses a query builder,
  then this directive will apply a LIMIT clause to it.
  Typically, this option should only be used for root fields,
  as it may cause wrong results with batched relation queries.
  """
  builder: Boolean = false
) on ARGUMENT_DEFINITION | FIELD_DEFINITION

"""
Resolve a field by calling a method on the parent object.
The field's arguments are passed to the method.
"""
directive @method(
  """
  The name of the method to call. Defaults to the field's name in snake_case.
  """
  name: String
) on FIELD_DEFINITION

"""
Map a model class to an object type.
This can be used when the name of the model differs from the name of the type.
"""
directive @model(
  """
  The class name of the corresponding model.
  """
  class: String!
) on OBJECT

"""
Resolve a polymorphic one-to-many association of the parent (`has_many ..., as:`) as a list,
batch-loaded so that listing it for many parents is not an N+1.
With `type`, the list is paginated.
"""
directive @morphMany(
  """
  The page size when the client omits `first`. Defaults to Config.pagination_default_count.
  """
  defaultCount: Int

  """
  The most records the client may ask for with `first`; null for no limit. Defaults to Config.pagination_max_count.
  """
  maxCount: Int

  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]

  """
  How to paginate the list: PAGINATOR, SIMPLE or CONNECTION. Without it, the whole list is returned.
  """
  type: PaginateType
) on FIELD_DEFINITION

"""
Resolve a polymorphic one-to-one association of the parent (`has_one ..., as:`),
batch-loaded so that loading it for many parents is not an N+1.
"""
directive @morphOne(
  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Resolve a polymorphic inverse association of the parent (`belongs_to ..., polymorphic: true`),
batch-loaded so that loading it for many parents is not an N+1.
"""
directive @morphTo(
  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]
) on FIELD_DEFINITION

"""
Resolve a polymorphic many-to-many association of the parent as a list,
batch-loaded so that listing it for many parents is not an N+1.
With `type`, the list is paginated.
"""
directive @morphToMany(
  """
  The page size when the client omits `first`. Defaults to Config.pagination_default_count.
  """
  defaultCount: Int

  """
  The most records the client may ask for with `first`; null for no limit. Defaults to Config.pagination_max_count.
  """
  maxCount: Int

  """
  The name of the association on the parent model. Defaults to the field's name in snake_case.
  """
  relation: String

  """
  Names of model scopes to apply to the underlying query, in order.
  """
  scopes: [String!]

