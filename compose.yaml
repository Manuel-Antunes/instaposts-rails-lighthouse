# Services for development: `docker compose up -d`.
services:
  # The database: PostgreSQL, for pg_search's full-text search (Lighthouse's @search).
  # config/database.yml connects as this user, with this password, on localhost:5432.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: instaposts
      POSTGRES_PASSWORD: instaposts-dev-secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instaposts"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Catches every email the app sends in development (confirmation, password reset).
  # SMTP on localhost:1025 (config/environments/development.rb); read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # S3-compatible storage for Active Storage (config/storage.yml, service "media"): the
  # bucket is public, so posts' images and videos and users' avatars have plain URLs.
  # Console at http://localhost:9001. MinIO stopped publishing images; these are the
  # community builds Pigsty keeps.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: instaposts
      MINIO_ROOT_PASSWORD: instaposts-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Creates the bucket and lets anyone read it, once MinIO answers.
  minio-setup:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 instaposts instaposts-dev-secret >/dev/null; do sleep 1; done &&
             mc mb --ignore-existing local/instaposts &&
             mc anonymous set download local/instaposts"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
