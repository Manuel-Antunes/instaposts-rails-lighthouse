# graphql-config, read by the GraphQL plugins for JetBrains IDEs and VS Code.
# The two generated files describe Lighthouse's directives and the types it
# generates. In development they are rewritten on boot and on every reload
# (config.ide_helper); elsewhere, refresh them with:
#   bin/rails lighthouse:ide_helper
schema:
  - graphql/**/*.graphql
  - schema-directives.graphql
  - programmatic-types.graphql
documents: 
  - app/graphql/**/*.rb