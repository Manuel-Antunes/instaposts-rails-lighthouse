type Post implements Node @node {
  id: ID! @globalId
  name: String!
  content: String!
  author: User @belongsTo
  "The post's page in the app (/posts/:id): Types::PostType#path."
  path: String!
  "How many users like the post."
  likesCount: Int!
  "Whether the signed-in user likes the post; false for guests. Types::PostType#viewer_has_liked."
  viewerHasLiked: Boolean!
  commentsCount: Int!
  "Oldest first, unless orderBy says otherwise."
  comments(orderBy: _ @orderBy(columns: ["created_at"])): [Comment!]!
    @hasMany(type: CONNECTION, defaultCount: 10, maxCount: 50)
  "Whether the signed-in user may move it to the trash: PostPolicy#destroy?."
  viewerCanDelete: Boolean!
  "When it went to the trash; null for a live post."
  deletedAt: DateTime @rename(attribute: "discarded_at")
  createdAt: DateTime!
  updatedAt: DateTime!
}

extend type Query {
  "A post by its global id. Authorized by PostPolicy#show?."
  post(id: ID! @globalId(decode: ID) @eq): Post @find @canResolved(ability: "show")

  "Live posts. trashed: ONLY or WITH lists the trash too: admins only (PostPolicy#index?)."
  posts(orderBy: _ @orderBy(columns: ["created_at", "name", "id"])): [Post!]!
    @paginate(type: CONNECTION)
    @softDeletes
    @canModel(ability: "index", injectArgs: true)
}

input CreatePostInput {
  name: String!
  content: String!
}

input UpdatePostInput {
  id: ID!
  name: String
  content: String
}

extend type Mutation {
  createPost(input: CreatePostInput! @spread): Post
    @guard
    @canModel(ability: "create")
    @create
    @inject(context: "current_user.id", name: "author_id")
  updatePost(input: UpdatePostInput! @spread): Post
    @guard
    @canModel(ability: "update")
    @update

  "Like a post as the signed-in user. Liking it again changes nothing. Mutations::LikePost."
  likePost(id: ID!): Post @guard

  "Take back the signed-in user's like. Mutations::UnlikePost."
  unlikePost(id: ID!): Post @guard

  "Move a post to the trash (discard): its author or an admin. Mutations::DeletePost."
  deletePost(id: ID!): Post @guard

  "Bring a post back from the trash. Admins only."
  restorePost(id: ID! @globalId(decode: ID) @whereKey): Post
    @guard
    @canModel(ability: "restore")
    @restore

  "Delete a trashed post for good, with its likes and comments. Admins only."
  forceDeletePost(id: ID! @globalId(decode: ID) @whereKey): Post
    @guard
    @canModel(ability: "force_delete")
    @forceDelete
}
